<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotoğraf Ödeme</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #292929);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        #kutu {
            width: 100%;
            max-width: 500px;
            background: white;
            color: #222;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,.4);
        }

        h1 {
            margin-top: 0;
        }

        .foto-alani {
            border: 2px dashed #aaa;
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
        }

        input[type="file"] {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .85;
        }

        #mesaj {
            margin-top: 20px;
            min-height: 30px;
            font-weight: bold;
        }

        .uyari {
            animation: sallan 0.35s;
            color: #d00000;
        }

        @keyframes sallan {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        .basari {
            padding: 20px;
        }

        .tik {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            font-size: 60px;
            line-height: 90px;
            margin: 0 auto 25px;
        }

        .basari h1 {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div id="kutu">

    <h1>📸 Fotoğraf Ödemesi</h1>

    <p>Ödeme yapmak için fotoğraflarını seç.</p>

    <p><strong>Minimum 10 fotoğraf gerekli.</strong></p>

    <div class="foto-alani">
        <input
            type="file"
            id="fotolar"
            accept="image/*"
            multiple
        >
    </div>

    <button onclick="odemeyiDene()">
        💳 ÖDEME YAP
    </button>

    <div id="mesaj"></div>

</div>


<script>

function odemeyiDene() {

    const dosyalar = document.getElementById("fotolar").files;
    const sayi = dosyalar.length;

    /*
       10'DAN AZ FOTOĞRAF
    */

    if (sayi < 10) {

        const mesaj = document.getElementById("mesaj");

        mesaj.innerHTML = `
            ❌ İŞLEM REDDEDİLDİ<br>
            <small>
                Yetersiz bakiye! 😂<br>
                Minimum 10 fotoğraf gerekli.
            </small>
        `;

        mesaj.classList.remove("uyari");

        void mesaj.offsetWidth;

        mesaj.classList.add("uyari");


        /*
           POS BENZERİ BİP BİP SESİ
        */

        const audio =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        function bip(zaman, frekans) {

            const oscillator = audio.createOscillator();
            const gain = audio.createGain();

            oscillator.type = "square";
            oscillator.frequency.value = frekans;

            gain.gain.setValueAtTime(0.15, zaman);

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                zaman + 0.18
            );

            oscillator.connect(gain);
            gain.connect(audio.destination);

            oscillator.start(zaman);

            oscillator.stop(zaman + 0.18);
        }

        bip(audio.currentTime, 180);
        bip(audio.currentTime + 0.25, 130);


        /*
           TELEFON TİTREŞİMİ
        */

        if (navigator.vibrate) {

            navigator.vibrate([
                150,
                80,
                250
            ]);

        }

        return;
    }


    /*
       10 FOTOĞRAF VE ÜZERİ
    */

    document.getElementById("kutu").innerHTML = `

        <div class="basari">

            <div class="tik">
                ✓
            </div>

            <h1>
                Ödeme Başarılı! 🎉❤️
            </h1>

            <p style="font-size:24px;">
                Buluşma kesinleşti! 🥰
            </p>

            <p>
                ${sayi} fotoğraf ile ödeme kabul edildi. 📸
            </p>

            <p style="font-size:21px;">
                Görüşürüz ❤️
            </p>

        </div>

    `;


    /*
       BAŞARI SESİ
    */

    const audio =
        new (window.AudioContext ||
             window.webkitAudioContext)();


    function basariSesi(zaman, frekans) {

        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value = frekans;

        gain.gain.setValueAtTime(
            0.12,
            zaman
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            zaman + 0.3
        );

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.start(zaman);

        oscillator.stop(zaman + 0.3);
    }


    basariSesi(
        audio.currentTime,
        523
    );

    basariSesi(
        audio.currentTime + 0.18,
        659
    );

    basariSesi(
        audio.currentTime + 0.36,
        784
    );


    /*
       TELEFON TİTREŞİMİ
    */

    if (navigator.vibrate) {

        navigator.vibrate(200);

    }

}

</script>

</body>
</html>
